name: Build functional AI Power Game Factory APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build workspace
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Checkout upstream iappyxOS
        run: |
          git clone --depth 1 https://github.com/iappyx/iappyxOS.git build_source
          python3 patch/apply_patch.py

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Flutter dependencies
        working-directory: build_source/src/container_app
        run: flutter pub get

      - name: Analyze patched app
        working-directory: build_source/src/container_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build universal debug APK
        working-directory: build_source/src/container_app
        run: flutter build apk --debug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build_source/src/container_app/build/app/outputs/flutter-apk/app-debug.apk dist/AI_Power_Game_Factory-functional.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Power-Game-Factory-functional-APK
          path: dist/AI_Power_Game_Factory-functional.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          echo 'Functional APK build completed.' >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist/AI_Power_Game_Factory-functional.apk >> "$GITHUB_STEP_SUMMARY"
