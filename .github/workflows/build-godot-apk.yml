name: Build Godot 4.7.2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot_project/**'
      - '.github/workflows/build-godot-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -L --fail --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          mv "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64" "$HOME/godot/godot"
          chmod +x "$HOME/godot/godot"
          curl -L --fail --retry 3 -o /tmp/templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          "$HOME/godot/godot" --version

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/godot/godot" --headless --path godot_project --editor --quit-after 2

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/godot/godot" --headless --path godot_project --export-debug "Android" "$GITHUB_WORKSPACE/AI-Power-Game-Factory.apk"
          test -s "$GITHUB_WORKSPACE/AI-Power-Game-Factory.apk"
          ls -lh "$GITHUB_WORKSPACE/AI-Power-Game-Factory.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Power-Game-Factory-Godot-4.7.2
          path: AI-Power-Game-Factory.apk
          if-no-files-found: error
          retention-days: 7
